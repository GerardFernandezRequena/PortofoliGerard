<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/sytleLogin.css">
</head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Login Form -->
                <div id="signin" class="fade-in">
                    <div class="card shadow">
                        <form class="card-body p-4" method="post" action="php/login.php" id="loginForm">
                            <div class="text-center mb-4">
                                <h2 class="h3 mb-3 fw-bold">Iniciar Sessió</h2>
                                <div class="avatar-container">
                                    <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/avatar-1295397__340.png"
                                        class="rounded-circle img-thumbnail" width="120" alt="Avatar usuari"
                                        id="loginAvatar">
                                    <span class="avatar-edit" data-bs-toggle="tooltip" title="Canviar avatar">
                                        <i class="bi bi-pencil-square"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="username" name="username"
                                    placeholder="nom@exemple.cat" required>
                                <label for="username">Correu electrònic</label>
                            </div>

                            <div class="mb-3 password-input">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="passwd" name="passwd"
                                        placeholder="Contrasenya" required>
                                    <label for="passwd">Contrasenya</label>
                                </div>
                                <button type="button" class="password-toggle" id="toggleLoginPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Recorda'm
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">Accedir</button>

                            <div class="text-center mb-2">
                                <a href="#" class="text-decoration-none">Has oblidat la contrasenya?</a>
                            </div>

                            <div class="text-center">
                                <small>
                                    No tens compte?
                                    <a href="#" id="showSignup" class="text-decoration-none fw-bold">Registra't</a>
                                </small>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="signup" class="d-none fade-in">
                    <div class="card shadow">
                        <form class="card-body p-4" id="registerForm" method="post" action="registrer.php">
                            <div class="text-center mb-4">
                                <h2 class="h3 mb-3 fw-bold">Registrar</h2>
                                <div class="avatar-container">
                                    <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/avatar-1295397__340.png"
                                        class="rounded-circle img-thumbnail" width="120" alt="Avatar usuari"
                                        id="registerAvatar">
                                    <span class="avatar-edit" data-bs-toggle="tooltip" title="Canviar avatar">
                                        <i class="bi bi-pencil-square"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="nom" name="nom" placeholder="Nom complet"
                                    required>
                                <label for="nom">Nom complet</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="nom@exemple.cat" required>
                                <label for="email">Correu electrònic</label>
                                <div class="invalid-feedback" id="emailFeedback"></div>
                            </div>

                            <div class="mb-3 password-input">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="pass" name="pass"
                                        placeholder="Contrasenya" required>
                                    <label for="pass">Contrasenya</label>
                                </div>
                                <button type="button" class="password-toggle" id="toggleRegPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="password-strength mt-2" id="passwordStrength"></div>
                                <small class="form-text text-muted" id="passwordHelp">La contrasenya ha de tenir almenys
                                    8 caràcters, una lletra majúscula, una minúscula i un número.</small>
                            </div>

                            <div class="mb-3 password-input">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="repass" name="repass"
                                        placeholder="Repeteix la contrasenya" required>
                                    <label for="repass">Repeteix la contrasenya</label>
                                </div>
                                <button type="button" class="password-toggle" id="toggleRepassPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" id="repassFeedback"></div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" value="" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    Accepto els <a href="#">termes i condicions</a> i la <a href="#">política de
                                        privacitat</a>
                                </label>
                                <div class="invalid-feedback">Has d'acceptar els termes i condicions</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" id="registerButton"
                                disabled>Registrar</button>

                            <div class="text-center">
                                <small>
                                    Ja tens compte?
                                    <a href="#" id="showSignin" class="text-decoration-none fw-bold">Inicia sessió</a>
                                </small>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Mejorada</title>
    <link rel="stylesheet" href="FernandezGerard_act_005.css">
</head>

<body>
    <nav class="topnav">
        <a href="#" class="active">Inicio</a>
        <div class="title">Calculadora Mejorada</div>
        <a href="#">Ayuda</a>
    </nav>

    <div class="calculator-container">
        <div class="calculator" id="basic-calc">
            <h3>Calculadora Básica</h3>
            <input type="text" class="display" id="display" readonly>
            <div class="buttons-grid">
                <button class="btn btn-special" onclick="clearDisplay()">C</button>
                <button class="btn btn-mode" id="mode-toggle" onclick="toggleMode()">Científica</button>
                <button class="btn btn-operation" onclick="appendOperation('+')">+</button>

                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operation" onclick="appendOperation('-')">-</button>

                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operation" onclick="appendOperation('*')">×</button>

                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operation" onclick="appendOperation('/')">/</button>

                <button class="btn" onclick="appendNumber('0')">0</button>
                <button class="btn" onclick="appendDecimal()">.</button>
                <button class="btn btn-special" onclick="toggleSign()">±</button>
                <button class="btn btn-operation" onclick="calculate()">=</button>
            </div>
        </div>

        <div class="scientific-calculator" id="scientific-calc">
            <h3>Calculadora Científica</h3>
            <div class="scientific-buttons">
                <button class="btn btn-special" onclick="appendConstant('e')">e</button>
                <button class="btn btn-special" onclick="appendConstant('π')">π</button>
                <button class="btn btn-special" onclick="calculateFunction('log10')">log₁₀</button>

                <button class="btn btn-special" onclick="calculateFunction('sin')">sin</button>
                <button class="btn btn-special" onclick="calculateFunction('cos')">cos</button>
                <button class="btn btn-special" onclick="calculateFunction('tan')">tan</button>

                <button class="btn btn-special" onclick="calculateFunction('asin')">asin</button>
                <button class="btn btn-special" onclick="calculateFunction('sec')">sec</button>
                <button class="btn btn-special" onclick="calculateFunction('cot')">cot</button>

                <button class="btn btn-special" onclick="roundNumber('ceil')">⌈x⌉</button>
                <button class="btn btn-special" onclick="roundNumber('round')">⌊x⌋</button>
                <button class="btn btn-special" onclick="roundNumber('floor')">round</button>

                <button class="btn btn-special" onclick="calculateFunction('ln')">ln</button>
                <button class="btn btn-special" onclick="setOperation('pow')">x^y</button>
                <button class="btn btn-special" onclick="calculateFunction('sqrt')">√</button>
            </div>
        </div>
    </div>

    <script src="FernandezGerard_act_005.js"></script>
</body>

</html>

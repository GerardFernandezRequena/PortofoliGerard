<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./FernandezGerard_act_001.css">
    <link rel="shortcut icon" href="/img/faviconCalculator.png" type="image/png">
    <title>Calculadora Matemática</title>
</head>

<body>
    <div class="container">
        <h1>Calculadora</h1>
        <div class="formulario">
            <div class="input-group">
                <label for="primerNumero">Número 1:</label>
                <input type="number" id="primerNumero" placeholder="Ingrese un número">
            </div>

            <div class="input-group">
                <label for="segundoNumero">Número 2:</label>
                <input type="number" id="segundoNumero" placeholder="Ingrese un número">
            </div>

            <div class="botones">
                <button onclick="operacion('suma')" class="boton operador">+</button>
                <button onclick="operacion('resta')" class="boton operador">-</button>
                <button onclick="operacion('multiplicacion')" class="boton operador">×</button>
                <button onclick="operacion('division')" class="boton operador">÷</button>
            </div>

            <div class="resultado" id="resultado">
                <p>Resultado: <span id="valorResultado">-</span></p>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="./FernandezGerard_act_001.js"></script>
</body>

</html>

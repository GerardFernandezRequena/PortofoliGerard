<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendari mes en curs</title>
    <link rel="stylesheet" type="text/css" href="calendari.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body>
    <header>
        <h1>Calendari mes en curs</h1>
    </header>

    <main>
        <div class="calendar-controls">
            <button id="prev" class="nav-button">
                <img src="img/prev.png" width="40" alt="Mes anterior">
            </button>
            <button id="next" class="nav-button">
                <img src="img/next.png" width="55" alt="Mes següent">
            </button>
        </div>

        <div class="calendar-container">
            <table id="calendari"></table>
        </div>

        <!-- Modal per a notes -->
        <div class="modal" id="notesModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Afegir un comentari</h2>
                    <h3 id="selectedDate" class="selected-date"></h3>
                </div>
                <div class="modal-body">
                    <input type="text" class="note-input" id="noteInput" placeholder="Escriu la teva nota aquí...">
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeNotes()">Tancar</button>
                    <button class="btn btn-primary" onclick="saveNote()">Guardar</button>
                    <button class="btn btn-danger" onclick="deleteNote()">Eliminar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="calendari.js"></script>
</body>

</html>
